name: Personal fork build

on:
  workflow_dispatch:
  push:
    branches:
      - personal-testflight

permissions:
  contents: read

jobs:
  unsigned-device-build:
    name: Unsigned iPhone build
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Check out Blink and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Resolve frameworks
        run: ./get_frameworks.sh

      - name: Fetch terminal resources
        run: ./get_resources.sh

      - name: Configure personal build
        run: cp template_setup.xcconfig developer_setup.xcconfig

      - name: Build without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM='' \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package unsigned app
        if: success()
        run: |
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Blink.app"
          test -d "$app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/Blink-unsigned.zip"

      - name: Upload build and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blink-unsigned-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/Blink-unsigned.zip
            ${{ runner.temp }}/xcodebuild.log
